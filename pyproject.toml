[build-system]
requires = [
    'hatchling',
]
build-backend = 'hatchling.build'


[project]
name = 'zfs-on-root'
authors = [
    {name = 'Randy Syring', email = 'randy@syrings.us'},
]
requires-python = '~=3.12.0'
dynamic = ['version']
readme = 'readme.md'
dependencies = [
    "click>=8.1.7",
    "psutil>=7.1.0",
    "sh>=2.2.2",
]


[project.scripts]
'zor' = 'zor.cli:main'


[dependency-groups]
dev = [
    {include-group = "pytest"},
    {include-group = "prek"},
    {include-group = "audit"},
    {include-group = "nox"},
    'click',
    'ruff',
]
# Used by nox
pytest = [
    'pytest',
    'pytest-cov',
]
# Used by nox
prek = [
    'prek',
]
# Used by nox
audit = [
    'pip-audit',
]
# Used by CI
nox = [
    'nox',
]
